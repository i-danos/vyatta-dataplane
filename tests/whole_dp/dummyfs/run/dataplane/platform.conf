[dataplane]
# Two backends, comma separated, in preference order.
#
# The second exists so that selection can be shown to select: with one loaded,
# every selection answers "backend 0" whatever the capability, and a function
# that always returns the only available answer cannot be observed to be wrong.
# fal_plugin_test_b declares the complement set and sits second, so every
# capability it wins, it wins against the preference order rather than with it.
fal_plugin = ./fal_plugin_test.so,./fal_plugin_test_b.so
